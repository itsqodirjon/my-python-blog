<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>DevOps Portfolio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0d1117; color: #c9d1d9; padding: 40px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        h1 { color: #58a6ff; }
        h2 { color: #3fb950; }
        a { color: #58a6ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{ profile.name }}</h1>
        <p><strong>{{ profile.role }}</strong></p>
        <p>{{ profile.bio }}</p>
    </div>
    <h2>So'nggi Maqolalar</h2>
    {% for post in posts %}
    <div class="card">
        <h3>{{ post.title }}</h3>
        <small>{{ post.date }} | {{ post.category }}</small>
        <p>{{ post.summary }}</p>
    </div>
    {% endfor %}
</body>
</html>
